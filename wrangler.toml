name = "osong-jobs"
main = "src/index.ts"
compatibility_date = "2026-11-01"

[[d1_databases]]
binding = "DB"
database_name = "osong-jobs"
database_id = "6b0a2321-b4bd-47ab-8e7f-53d10751ce77"

# 자동 수집 시간 (UTC 기준, 한국시간 = UTC+9). src/collect.ts의 CRON_TO_GROUP과 똑같아야 한다.
[triggers]
crons = [
  "7 1,5,9 * * *",   # 교육청 게시판·기간제 인력풀: 한국 10:07, 14:07, 18:07
  "27 1,13 * * *",   # 어린이집: 10:27 충북, 22:27 충남
  "37 1 * * *",      # 세종 어린이집: 10:37
  "47 1 * * *",      # 세종 유치원 홈페이지 1/2: 10:47
  "57 1 * * *",      # 세종 유치원 홈페이지 2/2 + 학교지원본부: 10:57
]

# page.html을 문자열로 불러오기
[[rules]]
type = "Text"
globs = ["**/*.html"]
fallthrough = true

[observability]
enabled = true
