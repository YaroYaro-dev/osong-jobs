<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>채용 공고 : 유치원/어린이집</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--soft:#f3f5f7;--line:#e4e7eb;--ink:#111418;--sub:#5f6670;--mute:#9aa1aa;--blue:#1f6fff;--blue-soft:#eaf1ff;--green:#16865a;--green-soft:#e6f5ee;--amber:#c26a00;--amber-soft:#fff3e2;--rose:#c2405a;--rose-soft:#fdeef1}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans KR",system-ui,sans-serif;font-size:15px;line-height:1.5}
button,input,select{font:inherit;color:inherit}
.top{border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff;z-index:5}
.top .in{max-width:1200px;margin:0 auto;padding:14px 20px;display:flex;align-items:center;gap:12px}
.logo{font-size:22px;font-weight:800;letter-spacing:-.5px}
.logo span{color:var(--blue)}
@media (max-width:640px){.logo{font-size:19px}}
.upd{margin-left:auto;font-size:13px;color:var(--sub);background:var(--soft);padding:6px 12px;border-radius:999px;white-space:nowrap}
.wrap{max-width:1200px;margin:0 auto;padding:22px 20px 60px}
.search{max-width:560px;margin:4px auto 22px;position:relative}
.search input{width:100%;border:0;background:var(--soft);border-radius:10px;padding:15px 16px 15px 44px;font-size:16px;outline:none}
.search input:focus{box-shadow:0 0 0 2px var(--blue)}
.search svg{position:absolute;left:16px;top:50%;transform:translateY(-50%);color:var(--sub)}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding-top:18px;border-top:1px solid var(--line)}
.pill{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 14px;font-size:14px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;color:var(--sub)}
.pill:hover{border-color:#c9ced5}
.pill.on{border-color:var(--ink);color:var(--ink);font-weight:700}
.pill .cnt{color:var(--mute);font-weight:400;font-size:13px}
.pill.on .cnt{color:var(--blue)}
.sep{width:1px;height:24px;background:var(--line);margin:0 4px}
.drawer{display:none;margin-top:12px;background:var(--soft);border-radius:12px;padding:14px 16px;gap:12px}
.drawer.open{display:grid}
.drawer .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.drawer .lbl{font-size:13px;color:var(--sub);min-width:64px}
.drawer select,.drawer input{border:1px solid var(--line);border-radius:8px;padding:7px 10px;background:#fff;font-size:14px}
.mini{font-size:13px;padding:6px 11px}
.result{display:flex;align-items:center;justify-content:space-between;margin:22px 0 14px}
.result h2{margin:0;font-size:16px}
.result h2 b{color:var(--blue)}
.result select{border:0;background:none;font-size:14px;color:var(--sub);cursor:pointer;padding:4px}
.note{font-size:13px;color:var(--sub);background:var(--soft);border-radius:10px;padding:9px 12px;margin:-4px 0 14px}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.card{min-width:0;position:relative;border:1px solid var(--line);border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:12px;min-height:220px;background:#fff;transition:box-shadow .15s,border-color .15s}
.card:hover{border-color:#cdd2d8;box-shadow:0 4px 16px rgba(17,20,24,.06)}
.card.closed{opacity:.55}
.head{display:flex;gap:12px;align-items:center;padding-right:30px}
.ico{width:52px;height:52px;border-radius:12px;border:1px solid var(--line);display:grid;place-items:center;flex:none}
.ico.k{background:#f2f7ff;color:var(--blue)}
.ico.d{background:#fff5f6;color:var(--rose)}
.org{font-size:14px;font-weight:500;color:var(--sub);line-height:1.35;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical}
.org em{font-style:normal;color:var(--blue);font-weight:700}
.loc{font-size:12.5px;color:var(--mute);margin-top:2px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.ttl{font-size:17px;font-weight:700;line-height:1.45;color:var(--ink);text-decoration:none;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ttl:hover{text-decoration:underline}
.ttl em{font-style:normal;color:var(--blue)}
.meta{font-size:13.5px;color:var(--sub);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto}
.chip{font-size:12.5px;padding:3px 8px;border-radius:6px;background:var(--soft);color:var(--sub)}
.chip.dl{background:var(--blue-soft);color:var(--blue);font-weight:500}
.chip.soon{background:var(--amber-soft);color:var(--amber);font-weight:700}
.chip.end{background:var(--soft);color:var(--mute)}
.chip.unk{background:var(--soft);color:var(--mute)}
.chip.o{background:var(--green-soft);color:var(--green);font-weight:700}
.chip.new{background:none;color:var(--amber);font-weight:700;padding-left:2px}
.chip.src{background:none;color:var(--mute);border:1px solid var(--line)}
.save{position:absolute;top:18px;right:16px;background:none;border:0;cursor:pointer;padding:4px;color:#c3c8cf}
.save.on{color:var(--blue)}
.empty{grid-column:1/-1;text-align:center;color:var(--sub);padding:60px 0}
.status{margin-top:40px;border-top:1px solid var(--line);padding-top:20px}
.status summary{cursor:pointer;font-weight:700;font-size:15px}
.st{display:flex;justify-content:space-between;gap:10px;font-size:13px;padding:8px 0;border-bottom:1px dashed var(--line)}
.st .ok{color:var(--green);white-space:nowrap}.st .bad{color:var(--rose)}
@media (max-width:980px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:640px){.grid{grid-template-columns:minmax(0,1fr)}.upd{display:none}.wrap{padding:16px 14px 50px}}
</style>
</head>
<body>
<header class="top"><div class="in">
  <div class="logo">채용 공고 <span>: 유치원/어린이집</span></div>
  <span class="upd" id="updated">불러오는 중…</span>
</div></header>

<main class="wrap">
  <div class="search">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input type="search" id="q" placeholder="기관명이나 공고 제목으로 검색 (예: 오송, 솔미, 방과후)">
  </div>

  <div class="bar" id="regionBar"></div>
  <div class="bar" style="border-top:0;padding-top:10px">
    <button class="pill on" data-type="all">전체 기관</button>
    <button class="pill" data-type="유치원">유치원</button>
    <button class="pill" data-type="어린이집">어린이집</button>
    <span class="sep"></span>
    <button class="pill on" id="openOnly">접수 중만</button>
    <button class="pill" id="savedOnly">★ 관심 공고</button>
    <button class="pill" id="filterBtn">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg>
      기간 필터<span class="cnt" id="periodBadge"></span>
    </button>
  </div>
  <div class="drawer" id="drawer">
    <div class="row"><span class="lbl">기준</span>
      <select id="pBasis"><option value="posted">등록일</option><option value="deadline">마감일</option></select>
      <input type="date" id="pFrom"> ~ <input type="date" id="pTo">
    </div>
    <div class="row"><span class="lbl">빠른 선택</span>
      <button class="pill mini" data-quick="7">최근 7일 등록</button>
      <button class="pill mini" data-quick="30">최근 30일 등록</button>
      <button class="pill mini" data-quick="future">오늘 이후 마감</button>
      <button class="pill mini" id="pClear">기간 해제</button>
    </div>
  </div>

  <div class="result">
    <h2>검색 결과 <b id="count">0</b>개</h2>
    <select id="sort">
      <option value="posted:desc">최신순</option>
      <option value="posted:asc">오래된순</option>
      <option value="deadline:asc">마감 빠른순</option>
      <option value="deadline:desc">마감 늦은순</option>
    </select>
  </div>
  <p class="note" id="tabNote" hidden></p>
  <div class="grid" id="list"></div>

  <details class="status" id="statusPanel">
    <summary>수집 현황</summary>
    <div id="states"></div>
  </details>
</main>

<script>
var DATA = { jobs: [], states: [] };
var st = { tab: 'all', type: 'all', q: '', open: true, savedOnly: false, sort: 'posted', dir: 'desc', basis: 'posted', from: '', to: '' };
var TABS = [['all','전체 지역'],['osong','오송'],['충북','충북'],['세종','세종'],['jochiwon','조치원']];
var NOTES = {
  osong: '오송 공고: 어린이집은 상세 소재지가 오송읍으로 확인된 것, 교육청 공고는 주소를 확인해 둔 오송 기관(오송유치원·오송솔미유치원·오송솔미초·솔강초 병설 등)의 것만 보여요.',
  jochiwon: '조치원 공고: 어린이집 상세 소재지나 기관 주소가 조치원읍으로 확인된 것만 보여요. 통합 모집은 넣지 않아요.'
};
var SRC = { cbe: '충북교육청', mpool: '기간제 인력풀', 'chungbuk-child': '충북육아종합', 'sejong-child': '세종육아종합', 'sejong-school': '유치원 홈페이지', sssc: '학교지원본부' };
var saved = {};
try { saved = JSON.parse(localStorage.getItem('osong-saved') || '{}'); } catch (e) {}
function persist() { try { localStorage.setItem('osong-saved', JSON.stringify(saved)); } catch (e) {} }

function addr(p) { return String(p || '').replace(/\s*(담당자명?|전화번호?|연락처|시설장|팩스|이메일|홈페이지)[\s\S]*$/, '').trim(); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function hl(s) { // 검색어·오송·조치원 강조
  var t = esc(s); var words = ['오송', '조치원']; if (st.q) words.push(esc(st.q));
  words.forEach(function (w) { if (w) t = t.split(w).join('<em>' + w + '</em>'); });
  return t;
}
function today() { return new Date(Date.now() + 9 * 3600e3).toISOString().slice(0, 10); }
function addDays(n) { return new Date(Date.now() + 9 * 3600e3 + n * 864e5).toISOString().slice(0, 10); }
var WD = ['일', '월', '화', '수', '목', '금', '토'];
function md(d) { var x = new Date(d + 'T00:00:00+09:00'); return (x.getMonth() + 1) + '/' + x.getDate() + '(' + WD[x.getDay()] + ')'; }
function dday(dl) {
  if (!dl) return { txt: '마감 미확인', cls: 'unk', open: null };
  var diff = Math.round((new Date(dl + 'T00:00:00+09:00') - new Date(today() + 'T00:00:00+09:00')) / 864e5);
  if (diff < 0) return { txt: '마감', cls: 'end', open: false };
  if (diff === 0) return { txt: '오늘 마감', cls: 'soon', open: true };
  return { txt: 'D-' + diff, cls: diff <= 3 ? 'soon' : '', open: true };
}
function inTab(j, tab) {
  if (tab === 'all') return true;
  if (tab === 'osong') return j.osong === 1;
  if (tab === 'jochiwon') return j.jochiwon === 1;
  return j.region === tab;
}
function filtered() {
  return DATA.jobs.filter(function (j) {
    if (!inTab(j, st.tab)) return false;
    if (st.type !== 'all' && j.type.indexOf(st.type) !== 0) return false;
    if (st.open && dday(j.deadline).open === false) return false;
    if (st.savedOnly && !saved[j.id]) return false;
    if (st.q) { var h = (j.title + ' ' + j.organization + ' ' + (j.place || '')).toLowerCase(); if (h.indexOf(st.q.toLowerCase()) < 0) return false; }
    var v = st.basis === 'deadline' ? j.deadline : j.posted;
    if ((st.from || st.to) && !v) return false;
    if (st.from && v < st.from) return false;
    if (st.to && v > st.to) return false;
    return true;
  }).sort(function (a, b) {
    var sign = st.dir === 'asc' ? 1 : -1;
    if (st.sort === 'deadline') {
      if (!a.deadline && !b.deadline) return b.posted.localeCompare(a.posted);
      if (!a.deadline) return 1; if (!b.deadline) return -1;
      return sign * a.deadline.localeCompare(b.deadline) || b.posted.localeCompare(a.posted);
    }
    return sign * (a.posted.localeCompare(b.posted) || (a.first_seen || '').localeCompare(b.first_seen || ''));
  });
}
var ICON_K = '<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 10 12 4l9 6"/><path d="M5 9v11h14V9"/><path d="M10 20v-5h4v5"/></svg>';
var ICON_D = '<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="3.2"/><path d="M5.5 20a6.5 6.5 0 0 1 13 0"/><path d="M9.5 7.2 8 5.5M14.5 7.2 16 5.5"/></svg>';
var BOOK = '<svg width="22" height="22" viewBox="0 0 24 24" fill="FILL" stroke="currentColor" stroke-width="1.8"><path d="M6 3h12v18l-6-4-6 4z"/></svg>';

function renderTabs() {
  document.getElementById('regionBar').innerHTML = TABS.map(function (t) {
    var n = DATA.jobs.filter(function (j) { return inTab(j, t[0]) && dday(j.deadline).open !== false; }).length;
    return '<button class="pill' + (st.tab === t[0] ? ' on' : '') + '" data-tab="' + t[0] + '">' + t[1] + ' <span class="cnt">' + n + '</span></button>';
  }).join('');
  var note = document.getElementById('tabNote');
  if (NOTES[st.tab]) { note.hidden = false; note.textContent = NOTES[st.tab]; } else note.hidden = true;
}
function render() {
  renderTabs();
  document.getElementById('sort').value = st.sort + ':' + st.dir;
  document.getElementById('openOnly').classList.toggle('on', st.open);
  document.getElementById('savedOnly').classList.toggle('on', st.savedOnly);
  document.getElementById('periodBadge').textContent = (st.from || st.to) ? ' · 설정됨' : '';
  document.getElementById('filterBtn').classList.toggle('on', !!(st.from || st.to));
  var rows = filtered();
  document.getElementById('count').textContent = rows.length;
  var newCut = new Date(Date.now() - 2 * 864e5).toISOString();
  document.getElementById('list').innerHTML = rows.length ? rows.map(function (j) {
    var d = dday(j.deadline); var k = j.type === '유치원';
    var org = j.organization.split(' · ')[0];
    var metaBits = j.organization.split(' · ').slice(1);
    var loc = addr(j.place) || (j.region === '세종' ? '세종특별자치시' : '충청북도');
    var chips =
      (j.deadline ? '<span class="chip ' + (d.open === false ? 'end' : 'dl') + '">~' + md(j.deadline) + '</span>' : '') +
      '<span class="chip ' + (d.cls || 'dl') + '">' + d.txt + '</span>' +
      (j.osong ? '<span class="chip o">오송</span>' : '') + (j.jochiwon ? '<span class="chip o">조치원</span>' : '') +
      '<span class="chip">' + (k ? '유치원' : '어린이집') + '</span>' +
      '<span class="chip src">' + esc(SRC[j.source] || j.source) + '</span>' +
      ((j.first_seen || '') > newCut ? '<span class="chip new">NEW</span>' : '');
    return '<article class="card' + (d.open === false ? ' closed' : '') + '">' +
      '<button class="save' + (saved[j.id] ? ' on' : '') + '" data-save="' + esc(j.id) + '" title="관심 공고">' + BOOK.replace('FILL', saved[j.id] ? 'currentColor' : 'none') + '</button>' +
      '<div class="head"><div class="ico ' + (k ? 'k' : 'd') + '">' + (k ? ICON_K : ICON_D) + '</div>' +
      '<div style="min-width:0"><div class="org">' + hl(org) + '</div><div class="loc">' + esc(loc) + '</div></div></div>' +
      '<a class="ttl" href="' + esc(j.url) + '" target="_blank" rel="noopener">' + hl(j.title) + '</a>' +
      '<div class="meta">등록 ' + esc(j.posted.replace(/-/g, '.')) + (metaBits.length ? ' · ' + esc(metaBits.join(' · ')) : '') + '</div>' +
      '<div class="chips">' + chips + '</div></article>';
  }).join('') : '<div class="empty">' + ((st.from || st.to)
      ? (st.basis === 'deadline' ? '마감일' : '등록일') + ' ' + (st.from || '') + ' ~ ' + (st.to || '') + ' 조건에 맞는 공고가 없어요.<br><button class="pill mini" id="emptyClear" style="margin-top:12px">기간 해제</button>'
      : '조건에 맞는 공고가 없어요.') + '</div>';
}
function renderStates() {
  var fmt = function (s) { return s ? new Date(s).toLocaleString('ko-KR', { timeZone: 'Asia/Seoul', month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' }) : '-'; };
  var bad = DATA.states.filter(function (s) { return s.error; }).length;
  document.querySelector('#statusPanel summary').textContent = '수집 현황' + (bad ? ' · 확인 필요 ' + bad + '곳' : ' · 모두 정상');
  document.getElementById('states').innerHTML = DATA.states.length ? DATA.states.map(function (s) {
    return '<div class="st"><span>' + esc(s.name) + ' · ' + s.count + '건' + (s.error ? '<br><span class="bad">⚠ ' + esc(s.error) + '</span>' : '') + '</span>' +
      '<span class="' + (s.succeeded ? 'ok' : 'bad') + '">' + (s.succeeded ? '성공 ' + fmt(s.succeeded) : '실패 ' + fmt(s.attempted)) + '</span></div>';
  }).join('') : '<p class="note">아직 수집 기록이 없어요.</p>';
  var last = DATA.states.map(function (s) { return s.succeeded || ''; }).sort().pop();
  document.getElementById('updated').textContent = '업데이트 ' + (last ? fmt(last) : '-');
}
function syncPeriod() { document.getElementById('pBasis').value = st.basis; document.getElementById('pFrom').value = st.from; document.getElementById('pTo').value = st.to; }

document.addEventListener('click', function (e) {
  if (e.target.id === 'emptyClear') { st.from = ''; st.to = ''; syncPeriod(); render(); return; }
  var t = e.target.closest('[data-tab]'); if (t) { st.tab = t.dataset.tab; render(); return; }
  var ty = e.target.closest('[data-type]');
  if (ty) { st.type = ty.dataset.type; document.querySelectorAll('[data-type]').forEach(function (b) { b.classList.toggle('on', b === ty); }); render(); return; }
  var s = e.target.closest('[data-save]');
  if (s) { var id = s.dataset.save; if (saved[id]) delete saved[id]; else saved[id] = 1; persist(); render(); return; }
  var qk = e.target.closest('[data-quick]');
  if (qk) {
    var v = qk.dataset.quick;
    if (v === 'future') { st.basis = 'deadline'; st.from = today(); st.to = ''; }
    else { st.basis = 'posted'; st.from = addDays(-+v); st.to = ''; }
    syncPeriod(); render(); return;
  }
});
document.getElementById('openOnly').onclick = function () { st.open = !st.open; render(); };
document.getElementById('savedOnly').onclick = function () { st.savedOnly = !st.savedOnly; render(); };
document.getElementById('filterBtn').onclick = function () { document.getElementById('drawer').classList.toggle('open'); };
document.getElementById('pClear').onclick = function () { st.from = ''; st.to = ''; syncPeriod(); render(); };
document.getElementById('pBasis').onchange = function (e) { st.basis = e.target.value; st.from = ''; st.to = ''; syncPeriod(); render(); };
document.getElementById('pFrom').onchange = function (e) { st.from = e.target.value; render(); };
document.getElementById('pTo').onchange = function (e) { st.to = e.target.value; render(); };
document.getElementById('q').oninput = function (e) { st.q = e.target.value.trim(); render(); };
document.getElementById('sort').onchange = function (e) { var v = e.target.value.split(':'); st.sort = v[0]; st.dir = v[1]; render(); };

fetch('/api/jobs').then(function (r) { return r.json(); }).then(function (d) { DATA = d; render(); renderStates(); })
  .catch(function () { document.getElementById('list').innerHTML = '<div class="empty">공고를 불러오지 못했어요. 잠시 후 새로고침해 주세요.</div>'; });
</script>
</body>
</html>
